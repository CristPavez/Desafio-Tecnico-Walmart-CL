spring.application.name=server-retail-walmart-cl

# Server configuration
server.port=8081

# SQLite Database
spring.datasource.url=jdbc:sqlite:src/main/resources/retail_walmart.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
# Changed to 'update' to auto-create tables if they don't exist
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.defer-datasource-initialization=true

# SQL initialization - Disabled to use custom initializer
spring.sql.init.mode=never

# Logging - Disabled SQL logging to reduce noise from DevTools restarts
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.io.github.cristpavez=INFO
logging.level.org.springframework.jdbc=WARN

